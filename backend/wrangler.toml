name = "arclytics-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "127.0.0.1"
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "arclytics"
# Production Cloudflare D1 (used by `wrangler deploy` and cron)
database_id = "4fc65632-6c25-41e5-8aca-7f888524c862"
# Local `wrangler dev` uses a separate SQLite DB under backend/.wrangler/state/

[[d1_databases]]
binding = "USER_DB"
database_name = "arclytics-users"
database_id = "9d64b1c5-143b-4f77-b7ed-9ed70c100dfd"

[triggers]
crons = ["*/10 * * * *"]

[vars]
ARCSCAN_BASE = "https://explorer.testnet.arc.io/api/v2"
ARCSCAN_STATS = "https://explorer.testnet.arc.io/stats-service/api/v1"
ARC_RPC = "https://rpc.testnet.arc.io"

[observability]
enabled = true
