name = "arclytics-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Install workspace deps from repo root before bundle (Cloudflare CI / wrangler deploy)
[build]
command = "pnpm install --frozen-lockfile"
cwd = ".."

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "arclytics"
# Production Cloudflare D1 (used by `wrangler deploy` and cron)
database_id = "4fc65632-6c25-41e5-8aca-7f888524c862"
# Local `wrangler dev` uses a separate SQLite DB under backend/.wrangler/state/
# (not this id). Old local placeholder was 00000000-0000-0000-0000-000000000001.

[triggers]
crons = ["*/10 * * * *"]

[vars]
ARCSCAN_BASE = "https://testnet.arcscan.app/api/v2"
ARCSCAN_STATS = "https://testnet.arcscan.app/stats-service/api/v1"

[observability]
enabled = true
